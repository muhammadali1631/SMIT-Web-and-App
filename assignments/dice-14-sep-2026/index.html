<!DOCTYPE html>
<html lang="en">
<head>
    <title>Dice Assignment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Parents of all dice boxes -->
    <div class="parent">
        <!-- First Box -->
        <div class="dice dice-one">
            <div class="dice-child-first dice-number"></div>
        </div>

        <!-- Second Box -->
        <div class="dice dice-two ">
            <div class="dice-child-first dice-number"></div>
            <div class="dice-child-second dice-number"></div>
        </div>

        <!-- Third Box -->
        <div class="dice dice-three">
            <div class="dice-child-first dice-number"></div>
            <div class="dice-child-second dice-number"></div>
            <div class="dice-child-third dice-number"></div>
        </div>

        <!-- Fourth Box -->
        <div class="dice dice-four">
            <div class="dice-child-first dice-number"></div>
            <div class="dice-child-second dice-number"></div>
            <div class="dice-child-third dice-number"></div>
            <div class="dice-child-fourth dice-number"></div>
        </div>
        
        <!-- Fifth Box -->
        <div class="dice dice-five">
            <div class="dice-child-first dice-number"></div>
            <div class="dice-child-second dice-number"></div>
            <div class="dice-child-third dice-number"></div>
            <div class="dice-child-fourth dice-number"></div>
            <div class="dice-child-fifth dice-number"></div>
        </div>
        
        <!-- Six Box -->
        <div class="dice dice-six">
            <div class="dice-child-first dice-number"></div>
            <div class="dice-child-second dice-number"></div>
            <div class="dice-child-third dice-number"></div>
            <div class="dice-child-fourth dice-number"></div>
            <div class="dice-child-fifth dice-number"></div>
            <div class="dice-child-sixth dice-number"></div>
        </div>
        
    </div>
</body>
</html>
